name: Deploy to Sprinthost

# Every push to main uploads changed files to agrexpert.ru over FTP.
# send.php and the private/ folder (Telegram bot token, saved leads) are NOT in the repo
# and are never uploaded or deleted: they live only on the server.
# Password: repository Secret FTP_PASSWORD (Settings -> Secrets and variables -> Actions).
# Server and login are the Sprinthost values below (repository Variables FTP_SERVER / FTP_USERNAME override them).
# Optional repository Variable FTP_SERVER_DIR (default: domains/agrexpert.ru/public_html/)

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build blog and validate
        run: python3 _blog/build.py --check

      - name: Commit validated generated site blog pages
        run: |
          set -euo pipefail
          git add -A -- blog services index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build approved SEO blog pages [skip ci]"
            git push origin HEAD:main
          fi
          git diff --exit-code

      - name: Upload to Sprinthost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER || '141.8.192.36' }}
          username: ${{ vars.FTP_USERNAME || 'a0792741' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/agrexpert.ru/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            _blog/**
            README.md
            send.php
            private/**
